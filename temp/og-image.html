<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>OG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&family=Audiowide&family=Roboto:wght@400;600;800&display=swap"
    rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: "Roboto", system-ui, sans-serif;
      color: #b8c4d8;
      background-color: #040711;
      background-image:
        radial-gradient(circle at 12% 15%, rgba(59, 130, 246, 0.24), transparent 45%),
        radial-gradient(circle at 88% 12%, rgba(34, 197, 94, 0.18), transparent 45%),
        radial-gradient(circle at 50% 100%, rgba(59, 130, 246, 0.12), transparent 55%),
        linear-gradient(180deg, #040711 0%, #090f1f 45%, #111a31 100%);
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.04;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .frame {
      position: relative;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px;
      border-top: 2px solid #3b82f6;
    }

    .card {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      background: rgba(9, 15, 31, 0.64);
      border: 1px solid rgba(96, 165, 250, 0.32);
      border-radius: 8px;
      box-shadow: 0 14px 48px -18px rgba(59, 130, 246, 0.4);
      text-align: center;
    }

    .brand {
      font-family: "Audiowide", "Roboto", sans-serif;
      font-weight: 400;
      font-size: 76px;
      letter-spacing: 0.06em;
      line-height: 1.15;
      background: linear-gradient(130deg, #3b82f6 0%, #22c55e 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.4));
    }

    .tagline {
      font-family: "Roboto", sans-serif;
      font-weight: 600;
      font-size: 64px;
      letter-spacing: 0.02em;
      background: linear-gradient(130deg, #60a5fa 0%, #4ade80 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .url {
      font-family: "Anonymous Pro", monospace;
      font-weight: 700;
      font-size: 32px;
      letter-spacing: 0.16em;
      color: #c4cede;
      margin-top: 8px;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="card">
      <h1 class="brand">AI Code Academy</h1>
      <p class="tagline">Learn to code smarter</p>
      <p class="url">Con Alberto Basalo</p>
    </div>
  </div>
</body>

</html>
